version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - errorlint
    - gochecknoinits
    - gocritic
    - goprintffuncname
    - modernize
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 100
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    lll:
      line-length: 140
    misspell:
      locale: US
  exclusions:
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # btd runs dnf5 and the privilege elevator with variable arguments by design.
      - linters:
          - gosec
        text: G204
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bacteriafield/btd
