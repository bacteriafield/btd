name: Release

on:
    push:
        tags:
            # v<version>, the tag btd.spec downloads its Source from.
            - 'v*'
permissions:
    contents: write

jobs:
    build-x86_64:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install dependencies
              # msgfmt compiles the translations.
              run: sudo apt-get update && sudo apt-get install -y gettext

            - name: Install Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            - name: Read version
              run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

            - name: Build
              run: make build VERSION="$VERSION" PREFIX=/usr
              env:
                  CGO_ENABLED: "0"

            - name: Strip binary
              run: strip btd

            - name: Create archive
              # Laid out from /; scripts/install.sh copies it file by file, since
              # untarring over / would chown / and /usr to the runner user.
              run: |
                  make install DESTDIR=dist PREFIX=/usr
                  install -Dm644 LICENSE dist/usr/share/licenses/btd/LICENSE
                  install -Dm644 README.md dist/usr/share/doc/btd/README.md
                  tar -czf "btd-$VERSION-x86_64.tar.gz" -C dist .

            - name: Upload binary
              uses: actions/upload-artifact@v7
              with:
                  name: btd-x86_64
                  path: btd-*-x86_64.tar.gz
                  if-no-files-found: error

    release:
        needs: build-x86_64
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # the full history and tags, for the changelog
                  fetch-depth: 0

            - name: Download artifact
              uses: actions/download-artifact@v8
              with:
                  name: btd-x86_64
                  path: dist

            - name: Generate changelog
              # Commits since the previous v* tag, or the whole history on the first release.
              run: |
                  prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
                  range="$GITHUB_REF_NAME"
                  if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; fi
                  git log --no-merges --pretty='- %s (%h)' "$range" > CHANGELOG.md
                  cat CHANGELOG.md

            - name: Create release
              run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "btd $GITHUB_REF_NAME" --notes-file CHANGELOG.md
              env:
                  GH_TOKEN: ${{ github.token }}

    # Publishes the release to the bacteriafield/btd Copr project: stamps
    # btd.spec with the tag's version, builds the SRPM and has Copr build it
    # for every chroot the project enables.
    #
    # Needs the COPR_CONFIG secret: the contents of the copr-cli config from
    # https://copr.fedorainfracloud.org/api/ (the token expires after 180
    # days), and "internet access during builds" enabled on the project.
    copr:
        needs: release
        runs-on: ubuntu-latest
        container: fedora:latest
        permissions:
            contents: read

        steps:
            - name: Install packaging tools
              # rpm-build: rpmbuild; rpmdevtools: rpmdev-bumpspec, spectool.
              run: dnf -yq install rpm-build rpmdevtools copr-cli

            - name: Checkout
              uses: actions/checkout@v7

            - name: Read version
              # v0.0.2 -> 0.0.2. RPM versions cannot contain "-": tag
              # prereleases as v1.0.0~rc1, not v1.0.0-rc1.
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  case "$version" in
                      ""|*-*|*[!0-9A-Za-z.+~^_]*)
                          echo "::error::$GITHUB_REF_NAME is not a valid RPM version"; exit 1 ;;
                  esac
                  echo "VERSION=$version" >> "$GITHUB_ENV"

            - name: Set the spec version
              # Version and Release 1, and a %changelog entry signed like the
              # spec's latest one.
              run: |
                  packager=$(awk '/^%changelog/ { f = 1; next }
                      f && /^\* / { sub(/^\* [^ ]+ [^ ]+ [^ ]+ [^ ]+ /, ""); sub(/ - [^ ]+$/, ""); print; exit }' btd.spec)
                  rpmdev-bumpspec -n "$VERSION" -u "$packager" -c "Update to $VERSION" btd.spec
                  sed -n '/^Version:/p; /^Release:/p; /^%changelog/,$p' btd.spec

            - name: Build SRPM
              run: |
                  spectool -g -C rpmbuild/SOURCES btd.spec
                  rpmbuild -bs --define "_topdir $PWD/rpmbuild" btd.spec

            - name: Submit to Copr
              # copr-cli waits for the builds and fails if any chroot fails.
              run: |
                  if [ -z "$COPR_CONFIG" ]; then
                      echo "::error::the COPR_CONFIG secret is not set"; exit 1
                  fi
                  (umask 077 && printf '%s\n' "$COPR_CONFIG" > "$RUNNER_TEMP/copr")
                  copr-cli --config "$RUNNER_TEMP/copr" build bacteriafield/btd rpmbuild/SRPMS/*.src.rpm
              env:
                  COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
