name: Release

on:
    push:
        tags:
            # v<version>, the tag btd.spec downloads its Source from.
            - 'v*'
permissions:
    contents: write

jobs:
    build-x86_64:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install dependencies
              # msgfmt compiles the translations.
              run: sudo apt-get update && sudo apt-get install -y gettext

            - name: Install Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            - name: Read version
              run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

            - name: Build
              run: make build VERSION="$VERSION" PREFIX=/usr
              env:
                  CGO_ENABLED: "0"

            - name: Strip binary
              run: strip btd

            - name: Create archive
              # Laid out from /; scripts/install.sh copies it file by file, since
              # untarring over / would chown / and /usr to the runner user.
              run: |
                  make install DESTDIR=dist PREFIX=/usr
                  install -Dm644 LICENSE dist/usr/share/licenses/btd/LICENSE
                  install -Dm644 README.md dist/usr/share/doc/btd/README.md
                  tar -czf "btd-$VERSION-x86_64.tar.gz" -C dist .

            - name: Upload binary
              uses: actions/upload-artifact@v7
              with:
                  name: btd-x86_64
                  path: btd-*-x86_64.tar.gz
                  if-no-files-found: error

    release:
        needs: build-x86_64
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # the full history and tags, for the changelog
                  fetch-depth: 0

            - name: Download artifact
              uses: actions/download-artifact@v8
              with:
                  name: btd-x86_64
                  path: dist

            - name: Generate changelog
              # Commits since the previous v* tag, or the whole history on the first release.
              run: |
                  prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
                  range="$GITHUB_REF_NAME"
                  if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; fi
                  git log --no-merges --pretty='- %s (%h)' "$range" > CHANGELOG.md
                  cat CHANGELOG.md

            - name: Create release
              run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "btd $GITHUB_REF_NAME" --notes-file CHANGELOG.md
              env:
                  GH_TOKEN: ${{ github.token }}
